# Dudas comunes. Las elige el equipo: la app no guarda lo que escribe la gente. Formato y reglas en ley_21801_celulares_en_colegios.yaml.
# OJO: esta versión de la ley tiene «Fin Vigencia: 30-NOV-2026». Revisar estas respuestas antes de esa fecha.

- pregunta: "¿Quién puede pedir información al Estado?"
  revisada: true
  respuesta:
    - frase: "Toda persona tiene derecho a pedir y recibir información de cualquier órgano de la Administración del Estado."
      cita: "Toda persona tiene derecho a solicitar y recibir información de cualquier órgano de la Administración del Estado"

- pregunta: "¿Qué información es pública?"
  revisada: true
  respuesta:
    - frase: "Los actos y resoluciones de los órganos de la Administración, sus fundamentos y los documentos que les sirven de sustento, salvo excepciones."
      cita: "los actos y resoluciones de los órganos de la Administración del Estado, sus fundamentos, los documentos que les sirvan de sustento o complemento directo y esencial"
    - frase: "También la información elaborada con presupuesto público."
      cita: "Asimismo, es pública la información elaborada con presupuesto público y toda otra información que obre en poder de los órganos de la Administración"

- pregunta: "¿Qué debe decir mi solicitud?"
  revisada: true
  respuesta:
    - frase: "Se hace por escrito o por sitios electrónicos."
      cita: "La solicitud de acceso a la información será formulada por escrito o por sitios electrónicos"
    - frase: "Debe indicar nombre, apellidos y dirección de quien solicita, además de su apoderado si lo tiene."
      cita: "Nombre, apellidos y dirección del solicitante y de su apoderado, en su caso."
    - frase: "Debe identificar claramente la información que se pide."
      cita: "Identificación clara de la información que se requiere."
    - frase: "Debe llevar la firma de quien solicita, por cualquier medio habilitado."
      cita: "Firma del solicitante estampada por cualquier medio habilitado."

- pregunta: "¿Cuánto tienen para responderme?"
  revisada: true
  respuesta:
    - frase: "Un máximo de 20 días hábiles desde que reciben una solicitud que cumpla los requisitos."
      cita: "en un plazo máximo de veinte días hábiles, contado desde la recepción de la solicitud"
    - frase: "Excepcionalmente, pueden extenderlo por otros 10 días hábiles."
      cita: "Este plazo podrá ser prorrogado excepcionalmente por otros diez días hábiles"

- pregunta: "¿Me pueden cobrar por la información?"
  revisada: true
  respuesta:
    - frase: "Solo los costos directos de reproducción y los demás valores que una ley autorice expresamente."
      cita: "Sólo se podrá exigir el pago de los costos directos de reproducción y de los demás valores que una ley expresamente autorice cobrar"

- pregunta: "¿Qué hago si no me responden o me la niegan?"
  revisada: true
  respuesta:
    - frase: "Puedes recurrir al Consejo que establece la ley, pidiendo amparo a tu derecho de acceso a la información."
      cita: "el requirente tendrá derecho a recurrir ante el Consejo establecido en el Título V, solicitando amparo a su derecho de acceso a la información"
    - frase: "El plazo para reclamar es de 15 días, desde la notificación del rechazo o desde que venció el plazo para responder."
      cita: "La reclamación deberá presentarse dentro del plazo de quince días, contado desde la notificación de la denegación de acceso a la información"
