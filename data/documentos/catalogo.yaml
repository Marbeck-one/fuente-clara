# Documentos disponibles en la app. Solo aparecen los registrados aquí, con su fuente oficial.
# El primero de la lista es el que se abre por defecto.
#
# Campos opcionales:
#   perfiles: opciones de "Qué cambia para ti" (por defecto: Estudiante, Trabajador/a, Adulto mayor)
#   ejemplos: textos de ejemplo que se muestran dentro de cada campo
#   trata_de: de qué trata el documento, en una frase. Se usa en «Estás leyendo la ley que trata de …»

documentos:
  - archivo: ley_21801_celulares_en_colegios.pdf
    titulo: "Ley 21.801 · Prohíbe y regula el uso de celulares en los colegios"
    fuente_nombre: "Biblioteca del Congreso Nacional · Ley Chile (versión del 11-feb-2026)"
    fuente_url: "https://bcn.cl/122kkM"
    ficticio: false
    trata_de: "el uso de celulares en los colegios"
    perfiles: ["Estudiante", "Apoderado/a", "Docente"]
    ejemplos:
      pregunta: "¿Puedo usar el celular en el recreo si estoy en la media?"
      afirmacion: "«Desde marzo los profes sí pueden usar el celular en clases, pero los alumnos no»"
      duda: "¿Cuántos colegios actualizaron su reglamento interno antes del 30 de junio de 2026?"

